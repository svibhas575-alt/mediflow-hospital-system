{% extends "auth_base.html" %}{% block title %}Patient registration · MediFlow{% endblock %}{% block content %}<div class="auth-eyebrow">PATIENT PORTAL</div><h1>Create your account</h1><p class="auth-muted">Your profile will be created in this demonstration system.</p><form method="post">{{ csrf_token() }}<label>Full name</label><input name="full_name" required maxlength="100" autocomplete="name"><label>Email address</label><input type="email" name="email" required autocomplete="email"><label>Date of birth</label><input type="date" name="dob" required max="{{ today }}"><label>Gender</label><select name="gender" required><option value="">Select</option><option>Female</option><option>Male</option><option>Other</option><option>Prefer not to say</option></select><label>Phone (optional)</label><input name="phone" maxlength="30" autocomplete="tel"><label>Password (10+ characters)</label><input type="password" name="password" required minlength="10" autocomplete="new-password"><label>Confirm password</label><input type="password" name="confirm_password" required minlength="10" autocomplete="new-password"><button class="auth-submit" type="submit">Create patient account →</button></form><div class="auth-links"><a href="{{ url_for('login') }}">Back to sign in</a></div>{% endblock %}
