<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}MediFlow{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head>
<body class="auth-body"><main class="auth-shell"><a class="auth-brand" href="{{ url_for('login') }}"><span class="brand-icon">✚</span><span><b>MediFlow</b><small>HOSPITAL MANAGEMENT & PATIENT CARE</small></span></a><section class="auth-card">{% with messages=get_flashed_messages(with_categories=true) %}{% if messages %}{% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endif %}{% endwith %}{% block content %}{% endblock %}</section><p class="auth-foot">Educational prototype · Use synthetic data only</p></main></body></html>
