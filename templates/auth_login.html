{% extends "auth_base.html" %}{% block title %}Sign in · MediFlow{% endblock %}{% block content %}<div class="auth-eyebrow">SECURE ACCESS</div><h1>Welcome to MediFlow</h1><p class="auth-muted">Choose your portal and sign in to continue.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Sign in as</label><select name="role" required><option value="hospital">Front Desk / Staff</option><option value="patient">Patient</option></select><label>Username or email address</label><input type="text" name="login_identifier" autocomplete="username" required placeholder="Front Desk: Vibhash · Patient: email"><label>Password</label><input type="password" name="password" autocomplete="current-password" required placeholder="Your password"><label class="check-line"><input type="checkbox" name="remember"> Keep me signed in</label><button class="auth-submit" type="submit">Sign in <span>→</span></button></form><div class="auth-links"><a href="{{ url_for('hospital_register') }}">Register a hospital</a><a href="{{ url_for('patient_register') }}">Create patient account</a></div>{% endblock %}
