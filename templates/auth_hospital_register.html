{% extends "auth_base.html" %}{% block title %}Hospital registration · MediFlow{% endblock %}{% block content %}<div class="auth-eyebrow">HOSPITAL PORTAL</div><h1>Create hospital access</h1><p class="auth-muted">Hospital registration requires an administrator-issued invitation code.</p><form method="post">{{ csrf_token() }}<label>Hospital / organization name</label><input name="hospital_name" required maxlength="150"><label>Your name</label><input name="full_name" required maxlength="120" autocomplete="name"><label>Work email</label><input type="email" name="email" required autocomplete="email"><label>Invitation code</label><input type="password" name="registration_code" required><label>Password (10+ characters)</label><input type="password" name="password" required minlength="10" autocomplete="new-password"><button class="auth-submit" type="submit">Create hospital account →</button></form><div class="auth-links"><a href="{{ url_for('login') }}">Back to sign in</a></div>{% endblock %}
